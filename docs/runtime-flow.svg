<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" width="1440" height="1200" font-family="'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5d4d"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1442e"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f8f"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a7d4f"/>
    </marker>
    <style>
      .head    { fill:#fffdf8; stroke:#c9bba6; stroke-width:2; rx:9 }
      .headMain{ fill:#fff7ee; stroke:#c1442e; stroke-width:2.5; rx:9 }
      .hname   { font-size:15px; font-weight:700; fill:#3d3229; text-anchor:middle }
      .hsub    { font-size:11px; fill:#8a7a67; text-anchor:middle }
      .life    { stroke:#d6c9b4; stroke-width:1.5; stroke-dasharray:4 5 }
      .msg     { stroke:#6b5d4d; stroke-width:2; fill:none; marker-end:url(#ar) }
      .msgR    { stroke:#c1442e; stroke-width:2.2; fill:none; marker-end:url(#arR) }
      .msgB    { stroke:#2f6f8f; stroke-width:2.2; fill:none; marker-end:url(#arB) }
      .msgG    { stroke:#5a7d4f; stroke-width:2.2; fill:none; marker-end:url(#arG) }
      .ret     { stroke:#8a7a67; stroke-width:1.8; fill:none; stroke-dasharray:6 4; marker-end:url(#ar) }
      .lbl     { font-size:13px; fill:#3d3229; font-weight:600 }
      .lbl2    { font-size:11.5px; fill:#7d6e5c }
      .ms      { font-size:11.5px; fill:#2f6f8f; font-weight:700; text-anchor:end }
      .step    { font-size:11px; font-weight:800; fill:#fff; text-anchor:middle }
      .selfbox { fill:#fdf6e8; stroke:#c99a2e; stroke-width:1.8; rx:7 }
      .loopbox { fill:none; stroke:#c1442e; stroke-width:2; stroke-dasharray:9 6; rx:12 }
      .loopTag { font-size:12.5px; font-weight:800; fill:#c1442e }
      .rfnote  { font-size:12px; fill:#5a4e40 }
      .tcol    { font-size:11px; fill:#8a7a67; text-anchor:end }
    </style>
  </defs>

  <rect width="1440" height="1180" fill="#f7f2e8"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#3d3229">BookBot 실행 흐름</text>
  <text x="272" y="46" font-size="14" fill="#7d6e5c">채팅 한 번에 실제로 일어나는 일 — 위에서 아래로 시간 순서</text>

  <!-- ═══ 참여자 머리 ═══════════════════════════════════════ -->
  <!-- x: 브라우저 150 / CloudFront 320 / APIGW 470 / Lambda 650 / DDB 850 / Bedrock 1030 / 도서API 1270 -->
  <rect class="head"     x="80"   y="72" width="140" height="52"/>
  <text class="hname"  x="150"  y="96">브라우저</text>
  <text class="hsub"   x="150"  y="114">사용자 화면</text>

  <rect class="head"     x="255"  y="72" width="130" height="52"/>
  <text class="hname"  x="320"  y="96">CloudFront</text>
  <text class="hsub"   x="320"  y="114">배달 창구</text>

  <rect class="head"     x="408"  y="72" width="124" height="52"/>
  <text class="hname"  x="470"  y="96">API Gateway</text>
  <text class="hsub"   x="470"  y="114">접수</text>

  <rect class="headMain" x="570"  y="72" width="160" height="52"/>
  <text class="hname"  x="650"  y="96">Lambda</text>
  <text class="hsub"   x="650"  y="114">두뇌 · 여기서 다 지휘</text>

  <rect class="head"     x="782"  y="72" width="136" height="52"/>
  <text class="hname"  x="850"  y="96">DynamoDB</text>
  <text class="hsub"   x="850"  y="114">저장소</text>

  <rect class="head"     x="958"  y="72" width="144" height="52"/>
  <text class="hname"  x="1030" y="96">Bedrock</text>
  <text class="hsub"   x="1030" y="114">AI (Claude)</text>

  <rect class="head"     x="1180" y="72" width="180" height="52"/>
  <text class="hname"  x="1270" y="96">도서 API 4곳</text>
  <text class="hsub"   x="1270" y="114">외부 인터넷</text>

  <!-- ═══ 생명선 ═══════════════════════════════════════════ -->
  <line class="life" x1="150"  y1="124" x2="150"  y2="1152"/>
  <line class="life" x1="320"  y1="124" x2="320"  y2="1152"/>
  <line class="life" x1="470"  y1="124" x2="470"  y2="1152"/>
  <line class="life" x1="650"  y1="124" x2="650"  y2="1152"/>
  <line class="life" x1="850"  y1="124" x2="850"  y2="1152"/>
  <line class="life" x1="1030" y1="124" x2="1030" y2="1152"/>
  <line class="life" x1="1270" y1="124" x2="1270" y2="1152"/>

  <!-- 시간 축 눈금 -->
  <text class="tcol" x="66" y="170">0초</text>
  <text class="tcol" x="66" y="400">0.5초</text>
  <text class="tcol" x="66" y="560">1초</text>
  <text class="tcol" x="66" y="800">3~10초</text>
  <text class="tcol" x="66" y="1074">5~15초</text>
  <line x1="70" y1="140" x2="70" y2="1140" stroke="#ddd2c0" stroke-width="1.5"/>

  <!-- ═══ 1. 요청 전달 ═════════════════════════════════════ -->
  <circle cx="96" cy="164" r="11" fill="#c1442e"/><text class="step" x="96" y="168">1</text>
  <path class="msgR" d="M 152 176 L 316 176"/>
  <text class="lbl"  x="160" y="168">POST /api/chat</text>
  <text class="lbl2" x="160" y="192">사용자가 쓴 문장 (HTTPS 암호화)</text>

  <circle cx="96" cy="222" r="11" fill="#c1442e"/><text class="step" x="96" y="226">2</text>
  <path class="msgR" d="M 322 232 L 466 232"/>
  <text class="lbl"  x="330" y="224">비밀 헤더를 붙여 전달</text>
  <text class="lbl2" x="330" y="248">CloudFront만 아는 값 → 우회 호출 차단</text>

  <circle cx="96" cy="280" r="11" fill="#c1442e"/><text class="step" x="96" y="284">3</text>
  <path class="msgR" d="M 472 290 L 646 290"/>
  <text class="lbl"  x="480" y="282">Lambda 실행</text>
  <text class="lbl2" x="480" y="306">첫 호출이면 준비에 1초 추가 (콜드 스타트)</text>

  <!-- ═══ 4. 문지기 검사 (self) ════════════════════════════ -->
  <circle cx="96" cy="336" r="11" fill="#c99a2e"/><text class="step" x="96" y="340">4</text>
  <rect class="selfbox" x="654" y="322" width="238" height="50"/>
  <text class="lbl"  x="666" y="342">문지기 검사</text>
  <text class="lbl2" x="666" y="362">비밀 헤더 · 빈 값 · 2,000자 초과</text>

  <!-- ═══ 5. 사용 횟수 ═════════════════════════════════════ -->
  <circle cx="96" cy="398" r="11" fill="#2f6f8f"/><text class="step" x="96" y="402">5</text>
  <path class="msgB" d="M 652 408 L 846 408"/>
  <text class="lbl"  x="660" y="400">사용 횟수 +1 (분 / 일)</text>
  <text class="ms"   x="1010" y="400">약 10ms</text>
  <text class="lbl2" x="660" y="426">분당 10회 · 하루 150회 초과면 여기서 중단</text>

  <!-- ═══ 6. 규칙 검사 (self) ══════════════════════════════ -->
  <circle cx="96" cy="456" r="11" fill="#c99a2e"/><text class="step" x="96" y="460">6</text>
  <rect class="selfbox" x="654" y="442" width="238" height="50"/>
  <text class="lbl"  x="666" y="462">규칙 검사 20여 개</text>
  <text class="lbl2" x="666" y="482">미성년 보호 · 인젝션 · 개인정보 → 0ms</text>

  <!-- ═══ 7. 주제 판정 ═════════════════════════════════════ -->
  <circle cx="96" cy="518" r="11" fill="#5a7d4f"/><text class="step" x="96" y="522">7</text>
  <path class="msgG" d="M 652 528 L 1026 528"/>
  <text class="lbl"  x="660" y="520">주제 판정 요청 → ALLOW / BLOCK 한 단어</text>
  <text class="ms"   x="1170" y="520">약 400ms</text>
  <text class="lbl2" x="660" y="546">책과 무관하면 여기서 중단 (판정은 24시간 캐시)</text>

  <!-- ═══ 8. 이전 대화 불러오기 ════════════════════════════ -->
  <circle cx="96" cy="578" r="11" fill="#2f6f8f"/><text class="step" x="96" y="582">8</text>
  <path class="msgB" d="M 652 588 L 846 588"/>
  <text class="lbl"  x="660" y="580">이전 대화 불러오기</text>
  <text class="ms"   x="1010" y="580">약 10ms</text>
  <text class="lbl2" x="660" y="606">“그중 제일 짧은 건?” 같은 후속 질문을 이해하려고</text>

  <!-- ═══════════ 도구 루프 ═══════════════════════════════ -->
  <rect class="loopbox" x="130" y="630" width="1240" height="352"/>
  <rect x="130" y="630" width="290" height="26" fill="#c1442e" rx="6"/>
  <text x="142" y="649" font-size="12.5" font-weight="800" fill="#fff">반복 · 최대 3회 또는 18초까지</text>

  <circle cx="96" cy="686" r="11" fill="#5a7d4f"/><text class="step" x="96" y="690">9</text>
  <path class="msgG" d="M 652 696 L 1026 696"/>
  <text class="lbl"  x="660" y="688">대화 + “쓸 수 있는 도구 목록” 전송</text>
  <text class="lbl2" x="660" y="714">search_books · browse_by_subject · find_free_ebooks · get_book_detail</text>

  <circle cx="96" cy="744" r="11" fill="#5a7d4f"/><text class="step" x="96" y="748">10</text>
  <path class="ret" d="M 1026 754 L 656 754"/>
  <text class="lbl"  x="662" y="746">AI의 판단이 돌아옴</text>
  <text class="lbl2" x="662" y="772">예: browse_by_subject(subject:"prostitution", recent:false) 를 불러라</text>

  <circle cx="96" cy="802" r="11" fill="#2f6f8f"/><text class="step" x="96" y="806">11</text>
  <path class="msgB" d="M 652 812 L 846 812"/>
  <text class="lbl"  x="660" y="804">같은 검색을 전에 했나? (캐시)</text>
  <text class="ms"   x="1010" y="804">약 10ms</text>

  <circle cx="96" cy="856" r="11" fill="#c1442e"/><text class="step" x="96" y="860">12</text>
  <path class="msgR" d="M 652 866 L 1264 866"/>
  <text class="lbl"  x="660" y="858">4곳을 동시에 검색 → 결과 병합 · 중복 제거</text>
  <text class="lbl2" x="660" y="884">캐시에 있으면 이 단계를 건너뜁니다 (1초 → 0.01초)</text>
  <text class="ms"   x="1356" y="858">1~2초</text>

  <!-- ═══ 13. 책 카드 즉시 전송 — 루프 '안'에서 일어납니다 ══ -->
  <circle cx="96" cy="918" r="11" fill="#2f6f8f"/><text class="step" x="96" y="922">13</text>
  <path class="msgB" d="M 646 928 L 154 928"/>
  <text class="lbl"  x="200" y="920">책 카드를 화면으로 바로 전송</text>
  <text class="lbl2" x="200" y="954">★ AI를 거치지 않습니다 — 그래서 표지·평점이 정확하고 토큰도 절약됩니다</text>

  <!-- ═══ 14. 최종 답변 ════════════════════════════════════ -->
  <circle cx="96" cy="1014" r="11" fill="#5a7d4f"/><text class="step" x="96" y="1018">14</text>
  <path class="ret" d="M 1026 1024 L 656 1024"/>
  <text class="lbl"  x="662" y="1016">검색 결과 요약을 받아 추천 글 작성 → Lambda로</text>
  <text class="lbl2" x="662" y="1042">AI에게는 권당 약 110토큰 요약만 줍니다 (전체는 1,200토큰)</text>

  <!-- ═══ 15. 저장 + 응답 ══════════════════════════════════ -->
  <circle cx="96" cy="1074" r="11" fill="#2f6f8f"/><text class="step" x="96" y="1078">15</text>
  <path class="msgB" d="M 652 1084 L 846 1084"/>
  <text class="lbl"  x="660" y="1076">저장 2건 — 세션(24시간) + 채팅 기록(90일)</text>

  <circle cx="96" cy="1128" r="11" fill="#c1442e"/><text class="step" x="96" y="1132">16</text>
  <path class="msgR" d="M 646 1138 L 154 1138"/>
  <text class="lbl"  x="200" y="1130">답변 글을 화면으로 전송 → 완료</text>

  <!-- ═══ 오른쪽 설명 상자 ═════════════════════════════════ -->
  <rect x="1178" y="1006" width="230" height="168" fill="#fdf6e8" stroke="#c99a2e" stroke-width="2" rx="10"/>
  <text x="1194" y="1032" font-size="14" font-weight="800" fill="#8a6a12">시간이 왜 중요한가</text>
  <text class="rfnote" x="1194" y="1058">API Gateway는 <tspan font-weight="700">29초</tspan>가 넘으면</text>
  <text class="rfnote" x="1194" y="1078">포기하고 오류를 냅니다.</text>
  <text class="rfnote" x="1194" y="1104">그래서 검색(9~13단계)에</text>
  <text class="rfnote" x="1194" y="1124"><tspan font-weight="700">18초 예산</tspan>을 걸어 두고, 넘으면</text>
  <text class="rfnote" x="1194" y="1144">검색을 멈추고 지금까지 찾은</text>
  <text class="rfnote" x="1194" y="1164">것으로 답을 만들어 보냅니다.</text>
</svg>
