<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b5d4d"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c1442e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f8f"/>
    </marker>
    <style>
      .box   { fill:#fffdf8; stroke:#c9bba6; stroke-width:2; rx:10; }
      .svc   { font-size:19px; font-weight:700; fill:#3d3229; }
      .role  { font-size:14px; fill:#c1442e; font-weight:600; }
      .tag   { font-size:12.5px; fill:#7d6e5c; }
      .edge  { stroke:#6b5d4d; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edgeR { stroke:#c1442e; stroke-width:2.5; fill:none; marker-end:url(#arrowRed); }
      .edgeB { stroke:#2f6f8f; stroke-width:2.5; fill:none; marker-end:url(#arrowBlue); }
      .plain { stroke:#6b5d4d; stroke-width:2; fill:none; }
      .elab  { font-size:13px; fill:#5a4e40; font-weight:600; }
      .zone  { fill:none; stroke-dasharray:8 6; stroke-width:2; rx:16; }
      .zlab  { font-size:14px; font-weight:700; }
      .num   { font-size:13px; font-weight:800; fill:#fff; }
      .lgd   { font-size:13px; fill:#5a4e40; }
    </style>
  </defs>

  <rect width="1400" height="880" fill="#f7f2e8"/>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#3d3229">BookBot 전체 구성도</text>
  <text x="284" y="46" font-size="14" fill="#7d6e5c">서버를 직접 관리하지 않는 서버리스(Serverless) 구조</text>

  <!-- ═══ 영역 ═══════════════════════════════════════════ -->
  <rect class="zone" x="240" y="72" width="1000" height="560" stroke="#2f6f8f"/>
  <!-- 계정 번호는 적지 않습니다. 저장소가 공개되면 그대로 노출됩니다. -->
  <text class="zlab" x="256" y="98" fill="#2f6f8f">AWS 클라우드 · 리전 us-east-1 (미국 버지니아)</text>

  <rect class="zone" x="150" y="678" width="1090" height="168" stroke="#5a7d4f"/>
  <text class="zlab" x="166" y="704" fill="#5a7d4f">외부 인터넷 — 무료 공개 도서 데이터베이스 4곳</text>

  <!-- ═══ 사용자 ═════════════════════════════════════════ -->
  <rect class="box" x="34" y="252" width="172" height="104"/>
  <text class="svc" x="54" y="286">사용자</text>
  <text class="tag" x="54" y="310">웹 브라우저</text>
  <text class="tag" x="54" y="332">한국 · 유럽 · 미국</text>
  <text class="tag" x="54" y="350">어디서나 접속 가능</text>

  <!-- ═══ CloudFront ═════════════════════════════════════ -->
  <rect class="box" x="262" y="240" width="204" height="132" stroke="#c1442e" stroke-width="2.5"/>
  <text class="svc" x="282" y="272">CloudFront</text>
  <text class="role" x="282" y="294">전 세계 배달 창구</text>
  <text class="tag" x="282" y="318">CLOUDFRONT_DOMAIN_MASKED</text>
  <text class="tag" x="282" y="336">.cloudfront.net</text>
  <text class="tag" x="282" y="358">HTTPS 자동 · 지역 제한 없음</text>

  <!-- ═══ S3 ═════════════════════════════════════════════ -->
  <rect class="box" x="524" y="118" width="204" height="116"/>
  <text class="svc" x="544" y="150">S3 버킷</text>
  <text class="role" x="544" y="172">화면 파일 보관함</text>
  <text class="tag" x="544" y="196">index.html · JS · CSS</text>
  <text class="tag" x="544" y="216">🔒 비공개 — CloudFront만 읽음</text>

  <!-- ═══ API Gateway ════════════════════════════════════ -->
  <rect class="box" x="524" y="410" width="204" height="116"/>
  <text class="svc" x="544" y="442">API Gateway</text>
  <text class="role" x="544" y="464">주문 접수 창구</text>
  <text class="tag" x="544" y="488">API_ID_MASKED</text>
  <text class="tag" x="544" y="508">응답 제한 시간 29초</text>

  <!-- ═══ Lambda ═════════════════════════════════════════ -->
  <rect class="box" x="782" y="392" width="184" height="148" stroke="#c1442e" stroke-width="2.5"/>
  <text class="svc" x="800" y="424">Lambda</text>
  <text class="role" x="800" y="446">서비스의 두뇌</text>
  <text class="tag" x="800" y="470">bookbot-api</text>
  <text class="tag" x="800" y="490">Node.js 22 · arm64</text>
  <text class="tag" x="800" y="510">1024MB · 최대 90초</text>
  <text class="tag" x="800" y="530">요청 올 때만 실행</text>

  <!-- ═══ Bedrock ════════════════════════════════════════ -->
  <rect class="box" x="1016" y="118" width="204" height="108"/>
  <text class="svc" x="1036" y="150">Bedrock</text>
  <text class="role" x="1036" y="172">AI 두뇌 (Claude)</text>
  <text class="tag" x="1036" y="196">Sonnet 4.6</text>
  <text class="tag" x="1036" y="214">대화 + 어떤 검색을 할지 판단</text>

  <!-- ═══ DynamoDB ═══════════════════════════════════════ -->
  <rect class="box" x="1016" y="250" width="204" height="108"/>
  <text class="svc" x="1036" y="282">DynamoDB</text>
  <text class="role" x="1036" y="304">기억 저장소</text>
  <text class="tag" x="1036" y="328">테이블 1개로 4가지 용도</text>
  <text class="tag" x="1036" y="346">지정 시간 뒤 자동 삭제(TTL)</text>

  <!-- ═══ Parameter Store ════════════════════════════════ -->
  <rect class="box" x="1016" y="382" width="204" height="108"/>
  <text class="svc" x="1036" y="414">Parameter Store</text>
  <text class="role" x="1036" y="436">비밀 금고</text>
  <text class="tag" x="1036" y="460">외부 API 키 · 오리진 비밀</text>
  <text class="tag" x="1036" y="478">암호화 보관 · 요금 없음</text>

  <!-- ═══ 안전장치 ═══════════════════════════════════════ -->
  <rect x="262" y="546" width="486" height="72" fill="#fdf6e8" stroke="#c99a2e" stroke-width="2" rx="10"/>
  <text class="svc" x="280" y="574" font-size="16" fill="#8a6a12">안전장치</text>
  <text class="tag" x="280" y="596">WAF 과다요청 차단 · CloudWatch 알람</text>
  <text class="tag" x="280" y="612">SNS 메일 통보 · Budgets 예산 초과 경고</text>

  <!-- ═══ 외부 도서 API 4종 ══════════════════════════════ -->
  <rect class="box" x="170" y="740" width="246" height="86"/>
  <text class="svc" x="186" y="770" font-size="16">Google Books</text>
  <text class="tag" x="186" y="792">커버리지 1위 · 표지 이미지</text>
  <text class="tag" x="186" y="812">키 필요 · 하루 1,000회 무료</text>

  <rect class="box" x="434" y="740" width="246" height="86"/>
  <text class="svc" x="450" y="770" font-size="16">Open Library</text>
  <text class="tag" x="450" y="792">주제 분류 · 출간연도 필터</text>
  <text class="tag" x="450" y="812">키 없이 사용</text>

  <rect class="box" x="698" y="740" width="246" height="86"/>
  <text class="svc" x="714" y="770" font-size="16">Hardcover</text>
  <text class="tag" x="714" y="792">평점 · 분위기 · 내용 주의</text>
  <text class="tag" x="714" y="812">토큰 필요 · 분당 60회</text>

  <rect class="box" x="962" y="740" width="246" height="86"/>
  <text class="svc" x="978" y="770" font-size="16">Project Gutenberg</text>
  <text class="tag" x="978" y="792">무료 전문 다운로드 링크</text>
  <text class="tag" x="978" y="812">저작권 만료 고전</text>

  <!-- ═══ 연결선 ═════════════════════════════════════════ -->

  <!-- 사용자 → CloudFront -->
  <path class="edge" d="M 206 304 L 258 304"/>
  <text class="elab" x="212" y="296">HTTPS</text>

  <!-- ① CloudFront → S3 : 화면 파일 -->
  <path class="edgeB" d="M 364 240 L 364 176 L 520 176"/>
  <circle cx="382" cy="156" r="13" fill="#2f6f8f"/>
  <text class="num" x="377" y="161">1</text>
  <text x="402" y="161" font-size="12.5" font-weight="600" fill="#2f6f8f">화면 파일 전달</text>

  <!-- ② CloudFront → API Gateway : 채팅 요청 -->
  <path class="edgeR" d="M 364 372 L 364 468 L 520 468"/>
  <circle cx="382" cy="448" r="13" fill="#c1442e"/>
  <text class="num" x="377" y="453">2</text>
  <text x="402" y="453" font-size="12.5" font-weight="600" fill="#c1442e">채팅 요청 전달</text>
  <text class="tag" x="378" y="500">비밀 헤더를 붙여 보냄</text>
  <text class="tag" x="378" y="518">(x-origin-secret)</text>

  <!-- API GW → Lambda -->
  <path class="edgeR" d="M 728 468 L 778 468"/>

  <!-- Lambda → Bedrock -->
  <path class="edge" d="M 966 424 L 986 424 L 986 172 L 1012 172"/>
  <text class="elab" x="902" y="290">질문 →</text>
  <text class="elab" x="902" y="308">← 답변</text>

  <!-- Lambda → DynamoDB -->
  <path class="edge" d="M 966 452 L 1000 452 L 1000 304 L 1012 304"/>

  <!-- Lambda → Parameter Store -->
  <path class="edge" d="M 966 500 L 1000 500 L 1000 436 L 1012 436" stroke-dasharray="6 4"/>
  <text class="tag" x="900" y="566">점선 = 설정값 읽기</text>

  <!-- Lambda → 외부 API (분배) -->
  <path class="plain" d="M 874 540 L 874 700"/>
  <path class="plain" d="M 293 700 L 1085 700"/>
  <path class="edge" d="M 293 700 L 293 736"/>
  <path class="edge" d="M 557 700 L 557 736"/>
  <path class="edge" d="M 821 700 L 821 736"/>
  <path class="edge" d="M 1085 700 L 1085 736"/>
  <text class="elab" x="888" y="654">4곳을 동시에 검색</text>
  <text class="tag" x="888" y="674">한 곳이 죽어도 나머지로 답합니다</text>

  <!-- ═══ 범례 ═══════════════════════════════════════════ -->
  <text class="lgd" x="34" y="406" font-weight="700" fill="#2f6f8f">① 화면을 보여주는 길</text>
  <text class="lgd" x="34" y="428">미리 만들어 둔 파일을</text>
  <text class="lgd" x="34" y="448">그대로 내려줍니다. 빠릅니다.</text>

  <text class="lgd" x="34" y="492" font-weight="700" fill="#c1442e">② 대화를 처리하는 길</text>
  <text class="lgd" x="34" y="514">Lambda가 AI와 도서 API를</text>
  <text class="lgd" x="34" y="534">호출해 답을 만듭니다.</text>
  <text class="lgd" x="34" y="554">보통 5~15초 걸립니다.</text>

  <text class="lgd" x="34" y="600" font-weight="700">서버가 없다?</text>
  <text class="lgd" x="34" y="622">항상 켜둔 컴퓨터가 없고,</text>
  <text class="lgd" x="34" y="642">요청이 올 때만 잠깐 실행돼서</text>
  <text class="lgd" x="34" y="662">쓴 만큼만 요금이 나옵니다.</text>
</svg>
